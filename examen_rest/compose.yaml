services:
  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - mysql

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: laboratorio_root
      MYSQL_DATABASE: laboratorio
      MYSQL_USER: laboratorio
      MYSQL_PASSWORD: laboratorio
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
